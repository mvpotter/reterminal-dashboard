<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    .tradingview-widget-container,
    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>

    <script
      type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js"
      async>
    {
      "symbols": [
        ["XETR:VWCE|12M"]
      ],
      "chartOnly": true,
      "autosize": true,

      "colorTheme": "light",
      "backgroundColor": "#ffffff",
      "isTransparent": false,

      "lineColor": "#000000",
      "lineWidth": 3,
      "lineType": 0,
      "chartType": "line",

      "gridLineColor": "rgba(0,0,0,0.15)",
      "fontColor": "#000000",
      "widgetFontColor": "#000000",

      "scalePosition": "right",
      "scaleMode": "Normal",

      "hideDateRanges": true,
      "hideMarketStatus": true,
      "hideSymbolLogo": true,

      "noTimeScale": false,
      "locale": "de_DE",

      "width": "100%",
      "height": "100%"
    }
    </script>
  </div>
</body>
</html>
