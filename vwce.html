<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    .tradingview-widget-container,
    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>

  <script
    type="text/javascript"
    src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js"
    async>
  {
    "symbols": [
      ["XETR:VWCE|12M"]
    ],

    "chartOnly": false,
    "autosize": true,

    "chartType": "line",
    "lineColor": "#000000",
    "lineWidth": 3,
    "lineType": 0,

    "topColor": "rgba(255,255,255,0)",
    "bottomColor": "rgba(255,255,255,0)",

    "backgroundColor": "#ffffff",
    "isTransparent": false,

    "widgetFontColor": "#000000",
    "fontColor": "#000000",

    "gridLineColor": "rgba(0,0,0,0.15)",

    "scalePosition": "right",
    "scaleMode": "Normal",

    "changeMode": "price-and-percent",
    "valuesTracking": "1",

    "hideDateRanges": true,
    "hideMarketStatus": true,
    "hideSymbolLogo": true,
    "noTimeScale": false,

    "locale": "de_DE",

    "width": "100%",
    "height": "100%"
  }
  </script>
</div>
</body>
</html>
